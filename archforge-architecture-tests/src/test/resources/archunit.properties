# FreezingArchRule 配置
# 基线文件随仓库提交，保证 CI 能阻断"新增违规"
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=true

# allowStoreUpdate=true 的语义（已实测验证，勿改为 false）：
#   - 新增违规  -> 构建失败（阻断生效，与 allowStoreUpdate 取值无关）
#   - 违规被修复 -> 自动收紧基线，构建保持绿
# 若设为 false，则"违规被修复"时也会因无法回写基线而抛 StoreUpdateFailedException，
# 导致修好一类违规反而让 CI 变红。
freeze.store.default.allowStoreUpdate=true

# 规则没有匹配到任何类时不要失败（例如尚不存在的 application 层）
archunit.failOnEmptyShould=false
